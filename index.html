<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<base href="/">
<title>크게보기 - 메뉴 도우미</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<!-- Screen Reader Announcements -->
<div id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<!-- ════════════════════════════════════════════
     SCREEN 0: SPLASH
════════════════════════════════════════════ -->
<section id="screen-splash" class="screen active" role="region" aria-label="시작 화면">
  <div class="splash-logo" aria-hidden="true">
    <img src="assets/logo.png" alt="로고" style="width: 100%; height: 100%; object-fit: cover; border-radius: 34px;">
  </div>
  <h1 class="splash-title">크게 크게</h1>
  <p class="splash-sub">메뉴가 잘 안 보이세요?<br>크게 보여드릴게요!</p>
  <button class="start-btn" onclick="navTo('home')" aria-label="앱 시작하기">시작하기</button>
</section>

<!-- ════════════════════════════════════════════
     SCREEN 1: HOME
════════════════════════════════════════════ -->
<main id="screen-home" class="screen" role="main">

  <!-- Top bar -->
  <header class="top-bar">
    <nav class="breadcrumb" id="breadcrumb-home" aria-label="현재 위치">
      <span aria-current="location">홈</span>
    </nav>
    <div class="top-bar-content" style="display: flex; align-items: center; gap: 12px;">
      <img src="assets/logo.png" alt="" class="header-logo">
      <h1 class="top-title home-title">크게 크게</h1>
    </div>
  </header>

  <!-- Menu zone -->
  <section class="home-menu-zone" aria-label="메뉴 카테고리"></section>

</main>

<!-- ════════════════════════════════════════════
     SCREEN 1.5: SEARCH
════════════════════════════════════════════ -->
<section id="screen-search" class="screen" role="region" aria-label="검색 화면">
  <header class="top-bar">
    <nav class="breadcrumb" aria-label="현재 위치">
      <span>홈</span>
      <span aria-current="location">검색</span>
    </nav>
    <div class="top-bar-content">
      <button class="back-btn" onclick="goBack()" aria-label="이전 화면으로 돌아가기">◀ 뒤로</button>
      <h1 class="top-title">검색하기</h1>
      <div class="top-bar-spacer" aria-hidden="true"></div>
    </div>
  </header>
  
  <div class="home-search-zone">
    <div class="search-field">
      <label for="homeSearchInput" class="sr-only">브랜드 또는 메뉴 검색</label>
      <input
        class="search-input"
        id="homeSearchInput"
        type="search"
        placeholder="브랜드 또는 메뉴 입력"
        inputmode="search"
        autocomplete="off"
        aria-describedby="search-hint"
      >
      <span id="search-hint" class="sr-only">초성으로도 검색이 가능합니다.</span>
    </div>
    <button class="voice-search-btn" id="voiceSearchBtn" type="button" aria-label="음성으로 검색하기">
      <span id="voiceSearchBtnText">음성으로 검색하기</span>
    </button>
    <button class="search-execute-btn" id="homeSearchBtn" type="button" aria-label="검색 실행하기">검색하기</button>
  </div>
</section>


<!-- ════════════════════════════════════════════
     SCREEN 2: RESULTS
════════════════════════════════════════════ -->
<section id="screen-results" class="screen" role="region" aria-label="검색 결과 화면">
  <header class="top-bar">
    <nav class="breadcrumb" id="resultsBreadcrumb" aria-label="현재 위치">
      <span>홈</span>
      <span aria-current="location">검색 결과</span>
    </nav>
    <div class="top-bar-content">
      <button class="back-btn" onclick="goBack()" aria-label="이전 화면으로 돌아가기">◀ 뒤로</button>
      <h1 class="top-title" id="resultsTitle">검색 결과</h1>
      <div class="top-bar-spacer" aria-hidden="true"></div>
    </div>
  </header>
  <div class="results-list" id="resultsList" role="list"></div>
</section>


<!-- ════════════════════════════════════════════
     SCREEN 3: BRAND DETAIL
════════════════════════════════════════════ -->
<section id="screen-detail" class="screen" role="region" aria-label="상세 메뉴 화면">
  <header class="top-bar">
    <nav class="breadcrumb" id="detailBreadcrumb" aria-label="현재 위치">
      <span>홈</span>
      <span>검색</span>
      <span aria-current="location">메뉴</span>
    </nav>
    <div class="top-bar-content">
      <button class="back-btn" onclick="goBack()" aria-label="이전 화면으로 돌아가기">◀ 뒤로</button>
      <h1 class="top-title" id="detailTitle">메뉴</h1>
      <div class="top-bar-spacer" aria-hidden="true"></div>
    </div>
  </header>
  
  <div id="detailContent" class="detail-content">
    <!-- Dynamic content will be injected here -->
  </div>
</section>


<!-- ════════════════════════════════════════════
     SCREEN 4: CAMERA
════════════════════════════════════════════ -->
<section id="screen-camera" class="screen" role="region" aria-label="돋보기 카메라 화면">
  <header class="top-bar">
    <nav class="breadcrumb" aria-label="현재 위치">
      <span aria-current="location">돋보기</span>
    </nav>
    <div class="top-bar-content">
      <button class="back-btn" onclick="goBack()" aria-label="이전 화면으로 돌아가기">◀ 뒤로</button>
      <h1 class="top-title">돋보기</h1>
      <div class="top-bar-spacer" aria-hidden="true"></div>
    </div>
  </header>

  <div class="camera-view" id="cameraView">
    <video id="cameraVideo" autoplay playsinline muted aria-label="카메라 미리보기"></video>
    <div class="flash-overlay" id="flashOverlay" aria-hidden="true"></div>
    <div class="zoom-indicator" id="zoomIndicator" aria-live="polite">확대 1×</div>
    <div class="contrast-indicator" id="contrastIndicator" aria-live="polite">대비 강화 ON</div>

    <!-- No support fallback -->
    <div class="camera-no-support" id="cameraNoSupport" role="alert">
      <span>카메라를 사용할 수 없습니다.<br>권한을 허용해 주세요.</span>
    </div>

    <!-- Captured image overlay -->
    <div class="captured-overlay" id="capturedOverlay" role="dialog" aria-label="캡처된 사진">
      <canvas id="capturedCanvas" aria-label="캡처된 이미지 미리보기"></canvas>
      <button class="close-capture-btn" onclick="closeCaptured()" aria-label="사진 닫기">✕ 닫기</button>
    </div>
  </div>

  <footer class="camera-controls">
    <div class="camera-zoom-row">
      <button class="zoom-btn" id="zoomOutBtn" aria-label="축소하기">−</button>
      <div class="zoom-label" id="zoomLabel">
        확대/축소<br><strong id="zoomValue" aria-live="polite">1×</strong>
      </div>
      <button class="zoom-btn" id="zoomInBtn" aria-label="확대하기">＋</button>
    </div>
    <div class="capture-row">
      <button class="contrast-btn" id="contrastBtn" aria-label="글씨 뚜렷하게 보기 토글">
        <span>글씨 뚜렷하게</span>
      </button>
      <button class="capture-btn" id="captureBtn" aria-label="사진 찍기">
        사진 찍기
      </button>
      <button class="contrast-btn" id="ocrBtn" aria-label="글자 읽기">
        <span>글자 읽기</span>
      </button>
    </div>
    <div id="ocrResultArea" class="sr-only" aria-live="polite"></div>
  </footer>
</section>


<!-- ════════════════════════════════════════════
     SCREEN 6: SETTINGS
════════════════════════════════════════════ -->
<section id="screen-settings" class="screen" role="region" aria-label="설정 화면">
  <header class="top-bar">
    <div class="breadcrumb" aria-label="현재 위치">
      <span aria-current="location">설정</span>
    </div>
    <div class="top-bar-content">
      <h1 class="top-title" style="text-align:left;">설정</h1>
    </div>
  </header>
  
  <div class="results-list settings-list">
    <section aria-labelledby="setting-font-size">
      <h2 id="setting-font-size" class="section-heading">글자 크기</h2>
      <div class="settings-grid-3">
        <button class="result-card setting-btn" onclick="updateSetting('fontSize', 'small')" aria-label="작게">작게</button>
        <button class="result-card setting-btn" onclick="updateSetting('fontSize', 'medium')" aria-label="보통">보통</button>
        <button class="result-card setting-btn" onclick="updateSetting('fontSize', 'large')" aria-label="크게">크게</button>
      </div>
    </section>

    <section aria-labelledby="setting-voice">
      <h2 id="setting-voice" class="section-heading">음성 안내</h2>
      <button class="result-card setting-toggle-btn" onclick="toggleVoice()" id="settings-voice-btn">
        <span>음성 안내 켜짐</span>
      </button>
    </section>

    <section aria-labelledby="setting-contrast">
      <h2 id="setting-contrast" class="section-heading">화면 모드</h2>
      <div class="settings-grid-2">
        <button class="result-card setting-btn" onclick="updateSetting('displayMode', 'normal')">기본</button>
        <button class="result-card setting-btn" onclick="updateSetting('displayMode', 'high-contrast')">고대비</button>
        <button class="result-card setting-btn" onclick="updateSetting('displayMode', 'grayscale')">흑백</button>
        <button class="result-card setting-btn" onclick="updateSetting('displayMode', 'invert')">색상 반전</button>
      </div>
    </section>

    <section aria-labelledby="setting-motion">
      <h2 id="setting-motion" class="section-heading">애니메이션</h2>
      <button class="result-card setting-toggle-btn" onclick="updateSetting('reducedMotion', !AppState.settings.reducedMotion)" id="settings-motion-btn">
        <span>애니메이션 사용 중</span>
      </button>
    </section>
  </div>
</section>


<!-- TOAST -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>



<!-- ════════════════════════════════════════════
     SCREEN 5: FAVORITES
════════════════════════════════════════════ -->
<section id="screen-fav" class="screen" role="region" aria-label="즐겨찾기 목록 화면">
  <header class="top-bar">
    <nav class="breadcrumb" aria-label="현재 위치">
      <span aria-current="location">즐겨찾기</span>
    </nav>
    <div class="top-bar-content">
      <h1 class="top-title" style="text-align:left;">즐겨찾기</h1>
    </div>
  </header>
  <div class="results-list" id="favList" role="list"></div>
</section>

<!-- ════════════════════════════════════════════
     BOTTOM NAVIGATION
════════════════════════════════════════════ -->
<nav class="bottom-nav" id="bottomNav" aria-label="주요 메뉴">
  <button class="nav-tab active" id="nav-home" onclick="navTo('home')" aria-label="홈 화면으로 이동" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    <span>홈</span>
  </button>
  <button class="nav-tab" id="nav-camera" onclick="navTo('camera')" aria-label="돋보기 카메라로 이동">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <span>돋보기</span>
  </button>
  <button class="nav-tab" id="nav-fav" onclick="navTo('fav')" aria-label="즐겨찾기 목록으로 이동">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
    </svg>
    <span>즐겨찾기</span>
  </button>
  <button class="nav-tab" id="nav-settings" onclick="navTo('settings')" aria-label="설정 화면으로 이동">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
    <span>설정</span>
  </button>
</nav>

<script src="/js/bootstrap.js"></script>
<script src="/js/speech.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
